[project]
name = "migration_service"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic (==2.12.5)",
    "pydantic-settings (==2.13.1)",
    "SQLAlchemy (==2.0.48)",
    "psycopg2-binary (==2.9.11)",
    "asyncpg (==0.31.0)",
    "alembic (==1.18.4)",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
