services:
  postgres:
    profiles: [ "infra", "platform" ]
    image: postgres:16.2
    hostname: ${POSTGRES_HOST}
    ports:
      - "${POSTGRES_PORT_EXTERNAL}:${POSTGRES_PORT_INTERNAL}"
    volumes:
      - "../../data/postgres:/var/lib/postgresql/data"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    profiles: [ "infra", "platform" ]
    image: redis:8.6.1-alpine
    hostname: ${REDIS_HOST}
    ports:
      - "${REDIS_PORT_EXTERNAL}:${REDIS_PORT_INTERNAL}"
    volumes:
      - "../../data/redis:/data"
    command: [
      "redis-server",
      "--requirepass", "${REDIS_PASSWORD}",
      "--save", "60", "1",
      "--loglevel", "warning",
      "--appendonly", "yes"
    ]
    environment:
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s


  migration_service:
    profiles: [ "platform" ]
    restart: "no"
    build:
      context: ../../
      dockerfile: infra/docker/migration_service/Dockerfile
    command: ["sh", "-c", "uv run --active --no-sync alembic -c alembic.ini upgrade head"]
    environment:
      ## POSTGRES
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT_INTERNAL}
    depends_on:
      postgres:
        condition: service_healthy

  bot_service:
    profiles: [ "platform" ]
    restart: "no"
    build:
      context: ../../
      dockerfile: infra/docker/bot_service/Dockerfile
    command: ["sh", "-c", "uv run --active --no-sync python -m bot_service.main"]
    environment:
      ## POSTGRES
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT_INTERNAL}

      ## REDIS
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT_INTERNAL}
      REDIS_DB: ${REDIS_DB}
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      ## TELEGRAM BOT
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}

      ## BRANDING
      TELEGRAM_BOT_NAME: ${TELEGRAM_BOT_NAME}
    depends_on:
      migration_service:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  vacancy_processing_service:
    profiles: [ "platform" ]
    restart: "no"
    build:
      context: ../../
      dockerfile: infra/docker/vacancy_processing_service/Dockerfile
    command: [ "sh", "-c", "uv run --active --no-sync python -m vacancy_processing_service.main" ]
    environment:
      ## POSTGRES
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT_INTERNAL}

      ## REDIS
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT_INTERNAL}
      REDIS_DB: ${REDIS_DB}
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      ## LLM
      LLM_NAME: ${LLM_NAME}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_TIMEOUT: ${LLM_TIMEOUT}

      ## VACANCY PROCESSING SERVICE
      VACANCY_PROCESSING_SERVICE_CONSUMER_GROUP: ${VACANCY_PROCESSING_SERVICE_CONSUMER_GROUP}
      VACANCY_PROCESSING_SERVICE_CONSUMER_NAME: ${VACANCY_PROCESSING_SERVICE_CONSUMER_NAME}
      VACANCY_PROCESSING_SERVICE_MAX_PARALLEL_TASKS: ${VACANCY_PROCESSING_SERVICE_MAX_PARALLEL_TASKS}
      VACANCY_PROCESSING_SERVICE_READ_BLOCK_MS: ${VACANCY_PROCESSING_SERVICE_READ_BLOCK_MS}
      VACANCY_PROCESSING_SERVICE_ERROR_SLEEP_SECONDS: ${VACANCY_PROCESSING_SERVICE_ERROR_SLEEP_SECONDS}
      VACANCY_PROCESSING_SERVICE_STALE_TASK_IDLE_MS: ${VACANCY_PROCESSING_SERVICE_STALE_TASK_IDLE_MS}
      VACANCY_PROCESSING_SERVICE_RECLAIM_BATCH_SIZE: ${VACANCY_PROCESSING_SERVICE_RECLAIM_BATCH_SIZE}
      VACANCY_PROCESSING_SERVICE_MAX_DELIVERY_ATTEMPTS: ${VACANCY_PROCESSING_SERVICE_MAX_DELIVERY_ATTEMPTS}
    depends_on:
      migration_service:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  resume_parser_service:
    profiles: [ "platform" ]
    restart: "no"
    build:
      context: ../../
      dockerfile: infra/docker/resume_parser_service/Dockerfile
    command: [ "sh", "-c", "uv run --active --no-sync python -m resume_parser_service.main" ]
    environment:
      ## POSTGRES
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT_INTERNAL}

      ## REDIS
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT_INTERNAL}
      REDIS_DB: ${REDIS_DB}
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      ## HEADHUNTER
      HEADHUNTER_BASE_URL: ${HEADHUNTER_BASE_URL}
      HEADHUNTER_TOKEN: ${HEADHUNTER_TOKEN}
      HEADHUNTER_TIMEOUT: ${HEADHUNTER_TIMEOUT}
      HEADHUNTER_AREA: ${HEADHUNTER_AREA}
      HEADHUNTER_PROFESSIONAL_ROLE: ${HEADHUNTER_PROFESSIONAL_ROLE}
      HEADHUNTER_ORDER_BY: ${HEADHUNTER_ORDER_BY}
      HEADHUNTER_PER_PAGE: ${HEADHUNTER_PER_PAGE}

      ## RESUME PARSER SERVICE
      RESUME_PARSER_SERVICE_POLL_INTERVAL_SECONDS: ${RESUME_PARSER_SERVICE_POLL_INTERVAL_SECONDS}
      RESUME_PARSER_SERVICE_LOOKBACK_SECONDS: ${RESUME_PARSER_SERVICE_LOOKBACK_SECONDS}
      RESUME_PARSER_SERVICE_ERROR_SLEEP_SECONDS: ${RESUME_PARSER_SERVICE_ERROR_SLEEP_SECONDS}
    depends_on:
      migration_service:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
